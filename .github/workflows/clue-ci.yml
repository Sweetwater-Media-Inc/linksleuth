name: Clue Browser CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    name: Build and test Clue in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust and WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Select stable Rust toolchain
        run: rustup default stable

      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: apps/clue/package-lock.json

      - name: Install Clue dependencies
        working-directory: apps/clue
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/clue
        run: npx playwright install --with-deps chromium

      - name: Build and test Clue
        working-directory: apps/clue
        run: npm test
